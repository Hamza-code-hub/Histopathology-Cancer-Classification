name: Build Complete ML Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create professional project structure
        shell: bash
        run: |
          set -e

          mkdir -p notebooks
          mkdir -p src
          mkdir -p assets
          mkdir -p models
          mkdir -p tests
          mkdir -p configs

          # ---------------------------------------------------------
          # Move existing notebook
          # ---------------------------------------------------------
          if [ -f "lung-cancer-effb3-and-resnet50.ipynb" ]; then
            mv lung-cancer-effb3-and-resnet50.ipynb notebooks/training_experiments.ipynb
          fi

          # ---------------------------------------------------------
          # src/__init__.py
          # ---------------------------------------------------------
          cat > src/__init__.py <<'PYEOF'
          """
          Lung & Colon Histopathology Classification Package.

          Models:
          - ResNet50
          - EfficientNetB3
          """
          PYEOF

          # ---------------------------------------------------------
          # src/config.py
          # ---------------------------------------------------------
          cat > src/config.py <<'PYEOF'
          from pathlib import Path

          BASE_DIR = Path(__file__).resolve().parent.parent

          DATA_DIR = BASE_DIR / "dataset"
          MODEL_DIR = BASE_DIR / "models"
          ASSETS_DIR = BASE_DIR / "assets"

          IMAGE_SIZE = (224, 224)
          BATCH_SIZE = 32
          NUM_CLASSES = 5
          RANDOM_SEED = 42

          CLASS_NAMES = [
              "colon_adenocarcinoma",
              "colon_benign",
              "lung_adenocarcinoma",
              "lung_benign",
              "lung_squamous_cell_carcinoma",
          ]
          PYEOF

          # ---------------------------------------------------------
          # src/data_loader.py
          # ---------------------------------------------------------
          cat > src/data_loader.py <<'PYEOF'
          """
          Dataset loading utilities.
          """

          from pathlib import Path
          import tensorflow as tf

          try:
              from .config import IMAGE_SIZE, BATCH_SIZE, RANDOM_SEED
          except ImportError:
              from config import IMAGE_SIZE, BATCH_SIZE, RANDOM_SEED


          AUTOTUNE = tf.data.AUTOTUNE


          def load_datasets(
              data_dir,
              image_size=IMAGE_SIZE,
              batch_size=BATCH_SIZE,
              validation_split=0.2,
              seed=RANDOM_SEED,
          ):
              """
              Load training and validation datasets from directory structure.

              Expected structure:

              dataset/
              ├── colon_adenocarcinoma/
              ├── colon_benign/
              ├── lung_adenocarcinoma/
              ├── lung_benign/
              └── lung_squamous_cell_carcinoma/
              """

              data_dir = Path(data_dir)

              if not data_dir.exists():
                  raise FileNotFoundError(
                      f"Dataset directory not found: {data_dir}"
                  )

              train_ds = tf.keras.utils.image_dataset_from_directory(
                  data_dir,
                  validation_split=validation_split,
                  subset="training",
                  seed=seed,
                  image_size=image_size,
                  batch_size=batch_size,
                  label_mode="categorical",
              )

              val_ds = tf.keras.utils.image_dataset_from_directory(
                  data_dir,
                  validation_split=validation_split,
                  subset="validation",
                  seed=seed,
                  image_size=image_size,
                  batch_size=batch_size,
                  label_mode="categorical",
              )

              class_names = train_ds.class_names

              train_ds = train_ds.prefetch(AUTOTUNE)
              val_ds = val_ds.prefetch(AUTOTUNE)

              return train_ds, val_ds, class_names
          PYEOF

          # ---------------------------------------------------------
          # src/preprocessing.py
          # ---------------------------------------------------------
          cat > src/preprocessing.py <<'PYEOF'
          """
          Image preprocessing and augmentation utilities.
          """

          import tensorflow as tf


          def get_data_augmentation():
              """
              Return augmentation pipeline for training images.
              """

              return tf.keras.Sequential(
                  [
                      tf.keras.layers.RandomFlip("horizontal"),
                      tf.keras.layers.RandomRotation(0.08),
                      tf.keras.layers.RandomZoom(0.10),
                      tf.keras.layers.RandomContrast(0.10),
                  ],
                  name="data_augmentation",
              )


          def normalize_image(image):
              """
              Convert image to float32 and normalize to [0, 1].
              """

              image = tf.cast(image, tf.float32)
              return image / 255.0
          PYEOF

          # ---------------------------------------------------------
          # src/models.py
          # ---------------------------------------------------------
          cat > src/models.py <<'PYEOF'
          """
          Deep learning model definitions.

          Supported backbones:
          - ResNet50
          - EfficientNetB3
          """

          import tensorflow as tf
          from tensorflow.keras import layers, Model

          try:
              from .config import IMAGE_SIZE, NUM_CLASSES
              from .preprocessing import get_data_augmentation
          except ImportError:
              from config import IMAGE_SIZE, NUM_CLASSES
              from preprocessing import get_data_augmentation


          def build_resnet50(
              input_shape=(*IMAGE_SIZE, 3),
              num_classes=NUM_CLASSES,
              dropout_rate=0.30,
              train_backbone=False,
          ):
              """
              Build transfer-learning classifier with ResNet50.
              """

              base_model = tf.keras.applications.ResNet50(
                  weights="imagenet",
                  include_top=False,
                  input_shape=input_shape,
              )

              base_model.trainable = train_backbone

              inputs = layers.Input(shape=input_shape)

              x = get_data_augmentation()(inputs)
              x = tf.keras.applications.resnet50.preprocess_input(x)

              x = base_model(x, training=False)
              x = layers.GlobalAveragePooling2D()(x)
              x = layers.Dropout(dropout_rate)(x)

              outputs = layers.Dense(
                  num_classes,
                  activation="softmax",
                  name="predictions",
              )(x)

              return Model(
                  inputs,
                  outputs,
                  name="ResNet50_Histopathology",
              )


          def build_efficientnetb3(
              input_shape=(*IMAGE_SIZE, 3),
              num_classes=NUM_CLASSES,
              dropout_rate=0.30,
              train_backbone=False,
          ):
              """
              Build transfer-learning classifier with EfficientNetB3.
              """

              base_model = tf.keras.applications.EfficientNetB3(
                  weights="imagenet",
                  include_top=False,
                  input_shape=input_shape,
              )

              base_model.trainable = train_backbone

              inputs = layers.Input(shape=input_shape)

              x = get_data_augmentation()(inputs)

              # EfficientNet preprocessing is already included
              # in recent TensorFlow/Keras implementations.
              x = base_model(x, training=False)

              x = layers.GlobalAveragePooling2D()(x)
              x = layers.Dropout(dropout_rate)(x)

              outputs = layers.Dense(
                  num_classes,
                  activation="softmax",
                  name="predictions",
              )(x)

              return Model(
                  inputs,
                  outputs,
                  name="EfficientNetB3_Histopathology",
              )


          def get_model(model_name, **kwargs):
              """
              Model factory.
              """

              name = model_name.lower()

              if name in {"resnet50", "resnet"}:
                  return build_resnet50(**kwargs)

              if name in {
                  "efficientnetb3",
                  "efficientnet",
                  "effb3",
              }:
                  return build_efficientnetb3(**kwargs)

              raise ValueError(
                  "Unknown model. Use 'resnet50' or 'efficientnetb3'."
              )
          PYEOF

          # ---------------------------------------------------------
          # src/train.py
          # ---------------------------------------------------------
          cat > src/train.py <<'PYEOF'
          """
          Model training entry point.

          Example:

          python -m src.train \
              --data dataset \
              --model resnet50 \
              --epochs 10
          """

          import argparse
          from pathlib import Path
          import tensorflow as tf

          from .data_loader import load_datasets
          from .models import get_model
          from .config import MODEL_DIR


          def parse_args():
              parser = argparse.ArgumentParser(
                  description="Train histopathology classifier"
              )

              parser.add_argument(
                  "--data",
                  type=str,
                  default="dataset",
                  help="Dataset directory",
              )

              parser.add_argument(
                  "--model",
                  type=str,
                  default="resnet50",
                  choices=["resnet50", "efficientnetb3"],
              )

              parser.add_argument(
                  "--epochs",
                  type=int,
                  default=10,
              )

              parser.add_argument(
                  "--learning-rate",
                  type=float,
                  default=1e-3,
              )

              return parser.parse_args()


          def train(
              data_dir,
              model_name,
              epochs,
              learning_rate,
          ):
              train_ds, val_ds, class_names = load_datasets(
                  data_dir
              )

              model = get_model(
                  model_name,
                  num_classes=len(class_names),
              )

              model.compile(
                  optimizer=tf.keras.optimizers.Adam(
                      learning_rate=learning_rate
                  ),
                  loss="categorical_crossentropy",
                  metrics=[
                      "accuracy",
                      tf.keras.metrics.Precision(
                          name="precision"
                      ),
                      tf.keras.metrics.Recall(
                          name="recall"
                      ),
                  ],
              )

              MODEL_DIR.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              checkpoint_path = (
                  MODEL_DIR /
                  f"{model_name}_best.keras"
              )

              callbacks = [
                  tf.keras.callbacks.ModelCheckpoint(
                      checkpoint_path,
                      monitor="val_accuracy",
                      save_best_only=True,
                      verbose=1,
                  ),
                  tf.keras.callbacks.EarlyStopping(
                      monitor="val_loss",
                      patience=4,
                      restore_best_weights=True,
                  ),
                  tf.keras.callbacks.ReduceLROnPlateau(
                      monitor="val_loss",
                      factor=0.5,
                      patience=2,
                      min_lr=1e-7,
                  ),
              ]

              history = model.fit(
                  train_ds,
                  validation_data=val_ds,
                  epochs=epochs,
                  callbacks=callbacks,
              )

              final_path = (
                  MODEL_DIR /
                  f"{model_name}_final.keras"
              )

              model.save(final_path)

              print("\nTraining complete")
              print("Classes:", class_names)
              print("Saved:", final_path)

              return model, history, class_names


          if __name__ == "__main__":
              args = parse_args()

              train(
                  data_dir=args.data,
                  model_name=args.model,
                  epochs=args.epochs,
                  learning_rate=args.learning_rate,
              )
          PYEOF

          # ---------------------------------------------------------
          # src/evaluate.py
          # ---------------------------------------------------------
          cat > src/evaluate.py <<'PYEOF'
          """
          Model evaluation utilities.
          """

          from pathlib import Path

          import numpy as np
          import matplotlib.pyplot as plt
          import tensorflow as tf

          from sklearn.metrics import (
              classification_report,
              confusion_matrix,
              ConfusionMatrixDisplay,
          )


          def evaluate_model(
              model_path,
              dataset,
              class_names,
              output_dir="assets",
          ):
              """
              Evaluate model and generate confusion matrix.
              """

              model = tf.keras.models.load_model(
                  model_path
              )

              y_true = []
              y_pred = []

              for images, labels in dataset:
                  probabilities = model.predict(
                      images,
                      verbose=0,
                  )

                  predictions = np.argmax(
                      probabilities,
                      axis=1,
                  )

                  targets = np.argmax(
                      labels.numpy(),
                      axis=1,
                  )

                  y_true.extend(targets)
                  y_pred.extend(predictions)

              y_true = np.asarray(y_true)
              y_pred = np.asarray(y_pred)

              print(
                  classification_report(
                      y_true,
                      y_pred,
                      target_names=class_names,
                      digits=4,
                  )
              )

              matrix = confusion_matrix(
                  y_true,
                  y_pred,
              )

              output_dir = Path(output_dir)
              output_dir.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              fig, ax = plt.subplots(
                  figsize=(9, 8)
              )

              display = ConfusionMatrixDisplay(
                  confusion_matrix=matrix,
                  display_labels=class_names,
              )

              display.plot(
                  ax=ax,
                  xticks_rotation=45,
                  cmap="Blues",
                  colorbar=False,
              )

              plt.tight_layout()

              output_path = (
                  output_dir /
                  "confusion_matrix.png"
              )

              plt.savefig(
                  output_path,
                  dpi=300,
                  bbox_inches="tight",
              )

              plt.close()

              print(
                  f"Confusion matrix saved to: "
                  f"{output_path}"
              )

              return matrix
          PYEOF

          # ---------------------------------------------------------
          # src/predict.py
          # ---------------------------------------------------------
          cat > src/predict.py <<'PYEOF'
          """
          Single-image inference utility.

          Example:

          python -m src.predict \
              --model models/resnet50_best.keras \
              --image sample.jpg
          """

          import argparse

          import numpy as np
          import tensorflow as tf

          from .config import (
              IMAGE_SIZE,
              CLASS_NAMES,
          )


          def load_image(
              image_path,
              image_size=IMAGE_SIZE,
          ):
              image = tf.keras.utils.load_img(
                  image_path,
                  target_size=image_size,
              )

              image = tf.keras.utils.img_to_array(
                  image
              )

              return np.expand_dims(
                  image,
                  axis=0,
              )


          def predict_image(
              model_path,
              image_path,
              class_names=CLASS_NAMES,
          ):
              model = tf.keras.models.load_model(
                  model_path
              )

              image = load_image(
                  image_path
              )

              probabilities = model.predict(
                  image,
                  verbose=0,
              )[0]

              predicted_index = int(
                  np.argmax(probabilities)
              )

              predicted_class = (
                  class_names[predicted_index]
              )

              confidence = float(
                  probabilities[predicted_index]
              )

              return {
                  "class": predicted_class,
                  "confidence": confidence,
                  "probabilities": {
                      name: float(prob)
                      for name, prob
                      in zip(
                          class_names,
                          probabilities,
                      )
                  },
              }


          def parse_args():
              parser = argparse.ArgumentParser()

              parser.add_argument(
                  "--model",
                  required=True,
              )

              parser.add_argument(
                  "--image",
                  required=True,
              )

              return parser.parse_args()


          if __name__ == "__main__":
              args = parse_args()

              result = predict_image(
                  args.model,
                  args.image,
              )

              print(
                  "\nPrediction:",
                  result["class"],
              )

              print(
                  "Confidence:",
                  f'{result["confidence"]:.2%}',
              )

              print("\nAll probabilities:")

              for class_name, probability \
                      in result["probabilities"].items():

                  print(
                      f"{class_name}: "
                      f"{probability:.2%}"
                  )
          PYEOF

          # ---------------------------------------------------------
          # src/visualize.py
          # ---------------------------------------------------------
          cat > src/visualize.py <<'PYEOF'
          """
          Training-history visualization utilities.
          """

          from pathlib import Path
          import matplotlib.pyplot as plt


          def plot_training_history(
              history,
              output_dir="assets",
          ):
              output_dir = Path(output_dir)

              output_dir.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              metrics = [
                  ("accuracy", "val_accuracy"),
                  ("loss", "val_loss"),
              ]

              for train_metric, val_metric in metrics:

                  if train_metric not in history.history:
                      continue

                  plt.figure(figsize=(8, 5))

                  plt.plot(
                      history.history[train_metric],
                      label=f"Training {train_metric}",
                  )

                  if val_metric in history.history:
                      plt.plot(
                          history.history[val_metric],
                          label=f"Validation {train_metric}",
                      )

                  plt.xlabel("Epoch")
                  plt.ylabel(train_metric.title())
                  plt.title(
                      f"Training and Validation "
                      f"{train_metric.title()}"
                  )

                  plt.legend()
                  plt.tight_layout()

                  output_path = (
                      output_dir /
                      f"{train_metric}_curve.png"
                  )

                  plt.savefig(
                      output_path,
                      dpi=300,
                      bbox_inches="tight",
                  )

                  plt.close()
          PYEOF

          # ---------------------------------------------------------
          # tests/test_models.py
          # ---------------------------------------------------------
          cat > tests/test_models.py <<'PYEOF'
          import tensorflow as tf

          from src.models import (
              build_resnet50,
              build_efficientnetb3,
          )


          def test_resnet50_output_shape():
              model = build_resnet50(
                  input_shape=(224, 224, 3),
                  num_classes=5,
              )

              assert model.output_shape == (
                  None,
                  5,
              )


          def test_efficientnetb3_output_shape():
              model = build_efficientnetb3(
                  input_shape=(224, 224, 3),
                  num_classes=5,
              )

              assert model.output_shape == (
                  None,
                  5,
              )
          PYEOF

          # ---------------------------------------------------------
          # tests/test_preprocessing.py
          # ---------------------------------------------------------
          cat > tests/test_preprocessing.py <<'PYEOF'
          import tensorflow as tf

          from src.preprocessing import normalize_image


          def test_normalize_image():
              image = tf.constant(
                  [[[255.0, 0.0, 127.5]]]
              )

              result = normalize_image(image)

              assert float(
                  tf.reduce_max(result)
              ) <= 1.0

              assert float(
                  tf.reduce_min(result)
              ) >= 0.0
          PYEOF

          # ---------------------------------------------------------
          # requirements.txt
          # ---------------------------------------------------------
          cat > requirements.txt <<'EOF'
          tensorflow>=2.15
          numpy>=1.24
          pandas>=2.0
          matplotlib>=3.7
          scikit-learn>=1.3
          pillow>=10.0
          jupyter>=1.0
          pytest>=7.4
          EOF

          # ---------------------------------------------------------
          # .gitignore
          # ---------------------------------------------------------
          cat > .gitignore <<'EOF'
          # Python
          __pycache__/
          *.py[cod]
          *.egg-info/
          build/
          dist/

          # Virtual environments
          venv/
          .venv/
          env/

          # Jupyter
          .ipynb_checkpoints/

          # IDE
          .vscode/
          .idea/

          # Operating systems
          .DS_Store
          Thumbs.db

          # Environment variables
          .env
          .env.*

          # Dataset
          dataset/
          data/

          # Large model files
          models/*.h5
          models/*.keras
          models/*.pt
          models/*.pth
          models/*.onnx

          # TensorBoard
          logs/
          EOF

          # ---------------------------------------------------------
          # pyproject.toml
          # ---------------------------------------------------------
          cat > pyproject.toml <<'EOF'
          [project]
          name = "histopathology-cancer-classification"
          version = "1.0.0"
          description = "Lung and colon histopathology classification using ResNet50 and EfficientNetB3"
          requires-python = ">=3.10"

          [tool.pytest.ini_options]
          pythonpath = ["."]
          testpaths = ["tests"]
          EOF

          # ---------------------------------------------------------
          # configs/training.yaml
          # ---------------------------------------------------------
          cat > configs/training.yaml <<'EOF'
          project:
            name: lung-colon-cancer-classification

          dataset:
            image_size:
              - 224
              - 224
            batch_size: 32
            validation_split: 0.20
            random_seed: 42

          training:
            epochs: 10
            learning_rate: 0.001
            early_stopping_patience: 4

          models:
            - resnet50
            - efficientnetb3
          EOF

          # ---------------------------------------------------------
          # Keep asset/model folders in Git
          # ---------------------------------------------------------
          touch assets/.gitkeep
          touch models/.gitkeep

          # ---------------------------------------------------------
          # Dataset README
          # ---------------------------------------------------------
          cat > dataset.README.md <<'EOF'
          # Dataset Setup

          The dataset is intentionally excluded from Git.

          Create a local `dataset/` directory using this structure:

          dataset/
          ├── colon_adenocarcinoma/
          ├── colon_benign/
          ├── lung_adenocarcinoma/
          ├── lung_benign/
          └── lung_squamous_cell_carcinoma/

          Place the corresponding histopathology images inside each class folder.
          EOF

      - name: Validate Python syntax
        run: |
          python -m compileall src tests

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: build complete histopathology ML project structure"
            git push
          fi
